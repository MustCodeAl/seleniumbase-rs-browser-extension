# Tools and tasks for the companion extension (https://mise.jdx.dev).
#
#   mise install     the toolchain below
#   mise run build   dist/chrome, dist/firefox and their zips
#   mise run test    bun test (selector generator, code generators, build)
#   mise run lint    tsc, the source and manifest rules, then web-ext lint on the firefox dist
#   mise run e2e     builds the e2e variant, then drives a real Chrome from Rust

[tools]
bun = "latest"
node = "lts"
# The e2e crate depends on seleniumbase-rs by path, which needs its rust-version.
rust = { version = "1.99", components = "clippy,rustfmt" }

[env]
# Settings every cargo build here uses, so build artifacts are shared.
CARGO_INCREMENTAL = "0"
CARGO_PROFILE_DEV_DEBUG = "0"

[tasks.build]
description = "Build dist/chrome and dist/firefox, and a zip of each"
run = "bun run scripts/build.ts"

[tasks.test]
description = "Unit tests: selectors, code generators, steps, manifest"
run = "bun test"

[tasks.typecheck]
description = "tsc over the extension (src/) and the Bun side (scripts/, tests/)"
run = "bun run typecheck"

[tasks.lint]
description = "tsc, the source and manifest rules, and web-ext lint on the firefox dist"
run = "bun run lint"

[tasks.e2e]
description = "Load the extension into headless Chrome from Rust and record, export, run"
depends = ["build"]
dir = "e2e"
env = { CARGO_BUILD_JOBS = "1" }
run = [
  "cd .. && bun run scripts/build.ts --e2e",
  "cargo test --test e2e -- --ignored --test-threads=1",
]

[tasks."e2e:lint"]
description = "cargo fmt and clippy on the e2e crate"
dir = "e2e"
env = { CARGO_BUILD_JOBS = "1" }
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --all-targets -- -D warnings",
]
